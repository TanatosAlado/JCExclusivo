<div class="overlay">
  <div class="modal-container fadeInDown " [class.ocupado]="ocupado" [attr.aria-busy]="!!ocupado">
    <div class="cerrar-modal fadeIn first">
      <button mat-icon-button (click)="cerrar()" [disabled]="!!ocupado" aria-label="Cerrar">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="imagen-central fadeIn first">
      <img src="../../../../../assets/logo.png" alt="Login" />
    </div>

    <div *ngIf="loginMayorista" class="banner-mayorista fadeIn second">
      <mat-icon>storefront</mat-icon>
      <span>Acceso exclusivo para clientes mayoristas</span>
    </div>

    <form #loginForm="ngForm">
      <mat-form-field class="fadeIn second" appearance="outline" color="accent">
        <mat-label>Usuario</mat-label>
        <input matInput type="text" name="usuario" [(ngModel)]="usuario" (ngModelChange)="resetLoginFail()" required
          [readonly]="!!ocupado" (keyup.enter)="login()" />
        <button *ngIf="usuario" matSuffix mat-icon-button type="button" (click)="usuario=''" [disabled]="!!ocupado" aria-label="Borrar usuario">
          <mat-icon style="color: #666;">close</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field class="fadeIn second" appearance="outline" color="accent">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" name="contrasena" [(ngModel)]="contrasena" (ngModelChange)="resetLoginFail()"
          required [readonly]="!!ocupado" (keyup.enter)="login()" />
        <button *ngIf="contrasena" matSuffix mat-icon-button type="button" (click)="contrasena=''" [disabled]="!!ocupado" aria-label="Borrar contraseña">
          <mat-icon style="color: #666;">close</mat-icon>
        </button>
      </mat-form-field>

      <div class="recuperacion-container fadeIn third">

        <a
          class="link-recuperacion"
          [class.deshabilitado]="!!ocupado"
          (click)="alternarRecuperacion()"
        >
          ¿Olvidaste tu contraseña?
        </a>

        <div class="recovery-card" *ngIf="mostrarRecuperacion">

          <div class="recovery-header">
            <mat-icon>lock_reset</mat-icon>
            <span>Recuperar contraseña</span>
          </div>

          <p class="recovery-text">
            Ingresa el correo asociado a tu cuenta y te enviaremos un enlace de recuperación.
          </p>

          <mat-form-field appearance="outline" color="accent">
            <mat-label>Correo electrónico</mat-label>

            <input
              matInput
              type="email"
              [(ngModel)]="emailRecuperacion"
              name="emailRecuperacion"
              [readonly]="!!ocupado"
            />

          </mat-form-field>

          <button
            mat-stroked-button
            color="primary"
            type="button"
            [disabled]="!!ocupado"
            (click)="recuperarContrasena()"
          >
            {{ ocupado === 'recuperar' ? 'Enviando…' : 'Enviar correo de recuperación' }}
          </button>

        </div>

      </div>

      <mat-hint *ngIf="loginFail" class="text-danger">{{ mensajeError }}</mat-hint>

      <button class="fadeIn third" mat-raised-button type="button" (click)="login()" [disabled]="!loginForm.form.valid || !!ocupado"
        [ngClass]="loginForm.form.valid ? 'botonesRojos' : ''">
        <span *ngIf="ocupado === 'ingresar'" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        {{ ocupado === 'ingresar' ? 'Ingresando…' : 'Ingresar' }}
      </button>

      <button class="fadeIn third" mat-stroked-button color="primary" type="button" (click)="continuarComoInvitado()" [disabled]="!!ocupado">
        {{ ocupado === 'invitado' ? 'Entrando…' : 'Continuar como invitado' }}
      </button>
    </form>

    <div class="registro-link fadeIn third ">
      <p>¿No tienes una cuenta? <a (click)="abrirRegistro()" [class.deshabilitado]="!!ocupado">Regístrate</a></p>
    </div>
  </div>
</div>
