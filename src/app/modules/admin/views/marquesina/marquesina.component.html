<app-encabezado>
  Gestión de Marquesina
</app-encabezado>

<div class="container mt-5">
  <div class="tabla-container">
    <div class="button-container">


      <!-- Botón Nuevo -->
      <button mat-raised-button class="boton-nuevo" (click)="abrirModalAltaMarquesina()">
        Nuevo
      </button>
    </div>

    <input class="search-input" (keyup)="applyFilter($event,datasourceMarquesina)" placeholder="Búsqueda Marquesina"
      #input>

    <div class="tabla-scroll">
      <table mat-table [dataSource]="datasourceMarquesina" class="mat-elevation-z8" style="width: 100%;">

        <!-- Mensaje Column -->
        <ng-container matColumnDef="mensaje">
          <th mat-header-cell *matHeaderCellDef class="cabecera"> Mensaje </th>
          <td mat-cell *matCellDef="let element"> {{element.mensaje}} </td>
        </ng-container>

        <!-- Rubro/Subrubro Column -->
        <ng-container matColumnDef="tipoCliente">
          <th mat-header-cell *matHeaderCellDef class="cabecera"> Tipo Mensaje </th>
          <td mat-cell *matCellDef="let element"> {{element.tipoCliente}} </td>
        </ng-container>

        <!-- Acciones Column -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="cabecera"> Acciones </th>
          <td mat-cell *matCellDef="let element">
            <a class="pointer" title="Ver Marquesina" (click)="verMarquesina(element)">
              <i class="fa-solid fa-eye"></i>
            </a>
            <a class="pointer" title="Editar Marquesina" (click)="editarMarquesina(element)">
              <i class="fa-solid fa-pen"></i>
            </a>
            <a class="pointer" title="Eliminar Marquesina" (click)="openConfirmDialog(element)">
              <i class="fa-solid fa-trash"></i>
            </a>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>
    </div>

    <div class="paginator-container">
      <mat-paginator #paginatorPendientes [pageSizeOptions]="[5, 10, 15]" [pageSize]="10" showFirstLastButtons
        aria-label="Select page of productos">
      </mat-paginator>
    </div>
  </div>
</div>
