<div class="logo-container">
  <img src="assets/logo.png" alt="Logo" class="logo-modal">
</div>

<mat-dialog-content [formGroup]="formMarquesina" class="contenido-modal">
  <!-- <div class="form-grid"> -->

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Mensaje</mat-label>
      <input matInput formControlName="mensaje" required />
      <mat-error *ngIf="formMarquesina.get('mensaje')?.hasError('required')">
        El mensaje es obligatorio
      </mat-error>
    </mat-form-field>

    <div class="radio-group-container">
      <mat-radio-group formControlName="tipoCliente">
        <mat-radio-button value="Mayorista">
          Mayorista
        </mat-radio-button>

        <mat-radio-button value="Minorista">
          Minorista
        </mat-radio-button>
      </mat-radio-group>

      <mat-error *ngIf="formMarquesina.get('tipoCliente')?.hasError('required')">
        El tipo de cliente es obligatorio
      </mat-error>
    </div>
  <!-- </div> -->
</mat-dialog-content>
  <!-- Botones dentro del flujo -->
   <mat-dialog-actions align="center">
  <div class="botones">
    <button mat-raised-button class="btn-cancelar" type="submit" [disabled]="formMarquesina.invalid"
      (click)="onSubmit()">
      Guardar
    </button>
    <button mat-dialog-close mat-raised-button class="btn-cancelar">
      Cancelar
    </button>
  </div>
</mat-dialog-actions>
