<div class="container mt-5">
  <div class="titulo mb-4">
    <h2>CATEGORÍAS</h2>
  </div>
<div class="categorias">

  <div
    class="categoria"
    *ngFor="let imagen of imagenesCategorias"
    (click)="seleccionarCategoria(imagen)">

    <img
      [src]="imagen"
      alt="Categoría">

  </div>

</div>
</div>
